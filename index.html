<style>
.kito-pctl-top{position:relative;display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;padding:10px 40px 10px 12px;border-left:4px solid #f3b629;border-radius:9px;background:#e5edff;color:#123a77;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:12px;line-height:1.45}
.kito-pctl-top .kito-pctl-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.kito-pctl-top strong{font-size:12px;font-weight:750}
.kito-pctl-top small{font-size:11px;color:#365078}
.kito-pctl-close{position:absolute;right:8px;top:6px;border:0;background:transparent;color:#123a77;border-radius:6px;font-size:22px;line-height:1;padding:3px 7px;cursor:pointer}
.kito-pctl-close:hover,.kito-pctl-close:focus-visible{background:rgba(18,58,119,.12)}
body.dark .kito-pctl-top,[data-theme="dark"] .kito-pctl-top{background:#203962;color:#fff}
body.dark .kito-pctl-top small,[data-theme="dark"] .kito-pctl-top small{color:#d9e6ff}
body.dark .kito-pctl-close,[data-theme="dark"] .kito-pctl-close{color:#fff}
</style>
<script>
(function(){
  let closed=false, busy=false;
  function update(){
    if(busy)return;
    const app=document.getElementById('app');if(!app)return;
    const kpi=document.querySelector('#nav button.on[data-v="kpi"], #nav button.on[data-v="KPI"]');
    const otherKpi=document.body.classList.contains('kpi-active');
    let box=document.getElementById('kito-pctl-top');
    if(closed||kpi||otherKpi){if(box)box.remove();return;}
    const date=document.getElementById('sd')?.value||'2026-10-27';
    const p95=date==='2026-10-27';
    if(!box){
      busy=true;
      box=document.createElement('div');box.id='kito-pctl-top';box.className='kito-pctl-top';box.setAttribute('role','status');
      box.innerHTML='<div class="kito-pctl-copy"><strong></strong><small></small></div><button type="button" class="kito-pctl-close" aria-label="Tutup informasi persentil waktu antrian" title="Tutup">&times;</button>';
      box.querySelector('button').addEventListener('click',()=>{closed=true;box.remove()});
      app.prepend(box);busy=false;
    }
    const title=p95?'Waktu Antrian · P95 (27 Okt 2026)':'Waktu Antrian · P90 (hingga 26 Okt 2026)';
    const desc='Data 27 Okt menggunakan P95; riwayat sampai 26 Okt dan MTD historis menggunakan P90. Kedua persentil tidak dibandingkan langsung.';
    if(box.querySelector('strong').textContent!==title)box.querySelector('strong').textContent=title;
    if(box.querySelector('small').textContent!==desc)box.querySelector('small').textContent=desc;
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const app=document.getElementById('app');if(!app)return;
    new MutationObserver(update).observe(app,{childList:true,subtree:false});
    document.addEventListener('change',update);
    document.addEventListener('click',()=>requestAnimationFrame(update));
    update();
  });
})();
</script>
