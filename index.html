<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#002060" />
    <title>Dashboard Monitoring Inbranch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css?v=6" />
    <link rel="stylesheet" href="assets/css/splash.css?v=2" />
    <script>
      try {
        if (localStorage.getItem("tema") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/kito-logo.png" />
    <link rel="icon" type="image/png" href="assets/images/kito-logo.png" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="kito-splash" class="kito-splash" aria-label="KITO sedang membuka dashboard" role="status">
      <picture class="kito-splash-picture">
        <source media="(orientation: portrait)" srcset="assets/images/splash-portrait.png" />
        <source media="(min-width: 1600px)" srcset="assets/images/splash-widescreen.png" />
        <img src="assets/images/splash-landscape.png" alt="KITO Key Inbranch Tracking & Overview" fetchpriority="high" decoding="async" />
      </picture>
    </div>
    <header>
      <div class="bar-atas">
        <h1>DASHBOARD MONITORING INBRANCH · R2</h1>
        <button id="tema" class="tema" type="button" aria-label="Ganti tema">
          🌙
        </button>
      </div>
      <div class="geser" id="geser">
        <div class="slide">
          <div class="fl">
            <select id="sa" aria-label="Area"></select><select id="sc" aria-label="Cabang"></select><select id="sd" aria-label="Tanggal"></select>
          </div>
        </div>
        <div class="slide">
          <div class="cari">
            <input
              id="q"
              type="search"
              placeholder="Cari nama atau kode cabang…"
              autocomplete="off"
              aria-label="Cari cabang"
            />
          </div>
        </div>
      </div>
      <div class="tab-geser">
        <button type="button" class="on">Filter</button>
        <button type="button">Cari</button>
      </div>
      <div id="hasil" class="hasil" hidden></div>
    </header>
    <main id="app"><div class="memuat">Memuat dashboard…</div></main>
    <noscript
      ><p class="memuat">
        Aktifkan JavaScript untuk melihat dashboard.
      </p></noscript
    >
    <div class="aksi">
      <button id="cetak" class="cetak" type="button">
        🖨 Cetak / Simpan PDF
      </button>
    </div>
    <footer id="ft"></footer>

    <nav class="nav" id="nav" aria-label="Navigasi utama">
      <button type="button" data-v="ranking">
        <span class="ik">🏆</span><span>Ranking</span>
      </button>
      <button type="button" data-v="region">
        <span class="ik">🗺️</span><span>Region</span>
      </button>
      <button type="button" data-v="area">
        <span class="ik">📍</span><span>Area</span>
      </button>
      <button type="button" data-v="cabang" class="on">
        <span class="ik">🏢</span><span>Cabang</span>
      </button>
    </nav>
    <link rel="stylesheet" href="assets/css/infografis.css?v=1" />
    <script src="assets/js/data.js?v=3"></script>
    <script src="assets/js/script.js?v=7"></script>
    <script src="assets/js/infografis-data.js?v=1"></script>
    <script src="assets/js/infografis.js?v=3"></script>
    <link rel="stylesheet" href="assets/css/pegawai.css?v=1" />
    <script src="assets/js/pegawai-data.js?v=1"></script>
    <script src="assets/js/pegawai.js?v=1"></script>
    <link rel="stylesheet" href="assets/css/area.css?v=1" />
    <script src="assets/js/area.js?v=1"></script>
    <script src="assets/js/splash.js?v=2"></script>
    <link rel="stylesheet" href="assets/css/area-kelompok.css?v=1" />
    <script src="assets/js/area-kelompok-data.js?v=2"></script>
    <script src="assets/js/area-kelompok.js?v=1"></script>
    <link rel="stylesheet" href="assets/css/area-o2o.css?v=3" />
    <script src="assets/js/area-o2o-data.js?v=3"></script>
    <script src="assets/js/area-o2o.js?v=5"></script>
    <link rel="stylesheet" href="assets/css/area-waktu.css?v=5" />
    <script src="assets/js/area-waktu-data.js?v=4"></script>
    <script src="assets/js/area-waktu.js?v=7"></script>
    <link rel="stylesheet" href="assets/css/area-nbds.css?v=2" />
    <script src="assets/js/area-nbds-data.js?v=3"></script>
    <script src="assets/js/area-nbds.js?v=6"></script>
    <script src="assets/js/cabang-tren.js?v=1"></script>
    <link rel="stylesheet" href="assets/css/ranking.css?v=2" />
    <script src="assets/js/ranking.js?v=5"></script>
    <link rel="stylesheet" href="assets/css/region.css?v=3" />
    <script src="assets/js/region-data.js?v=1"></script>
    <script src="assets/js/region.js?v=4"></script>
    <link rel="stylesheet" href="assets/css/animasi.css?v=2" />
    <script src="assets/js/animasi.js?v=4"></script>
</body>
</html>
