    <script>
      try {
        if (localStorage.getItem("tema") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
      // tandai mode aplikasi layar penuh (iOS: navigator.standalone; lainnya: display-mode)
      try {
        if (window.navigator.standalone === true || window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches)
          document.documentElement.classList.add("pwa");
      } catch (e) {}
    </script>

  <body>
    <div id="kito-splash" class="kito-splash" aria-label="KITO sedang membuka dashboard" role="status">
      <picture class="kito-splash-picture">
        <source media="(orientation: portrait)" srcset="assets/images/splash-portrait.png" />
        <source media="(min-width: 1600px)" srcset="assets/images/splash-widescreen.png" />
        <img src="assets/images/splash-landscape.png" alt="KITO Key Inbranch Tracking & Overview" fetchpriority="high" decoding="async" />
      </picture>
    </div>
    <header>
      <div class="bar-atas">
        <h1>DASHBOARD MONITORING INBRANCH · R2</h1>
        <button id="tema" class="tema" type="button" aria-label="Ganti tema">
          🌙
        </button>
      </div>
      <div class="geser" id="geser">
        <div class="slide">
          <div class="fl">
            <select id="sa" aria-label="Area"></select><select id="sc" aria-label="Cabang"></select><select id="sd" aria-label="Tanggal"></select>
          </div>
        </div>
        <div class="slide">
          <div class="cari">
            <input
              id="q"
              type="search"
              placeholder="Cari nama atau kode cabang…"
              autocomplete="off"
              aria-label="Cari cabang"
            />
          </div>
        </div>
      </div>
      <div class="tab-geser">
        <button type="button" class="on">Filter</button>
        <button type="button">Cari</button>
      </div>
      <div id="hasil" class="hasil" hidden></div>
    </header>
    <main id="app"><div class="memuat">Memuat dashboard…</div></main>
    <noscript
      ><p class="memuat">
        Aktifkan JavaScript untuk melihat dashboard.
      </p></noscript
    >
    <div class="aksi">
      <button id="cetak" class="cetak" type="button">
        🖨 Cetak / Simpan PDF
      </button>
    </div>
    <footer id="ft"></footer>

    <nav class="nav" id="nav" aria-label="Navigasi utama">
      <button type="button" data-v="ranking">
        <span class="ik">🏆</span><span>Ranking</span>
      </button>
      <button type="button" data-v="region">
        <span class="ik">🗺️</span><span>Region</span>
      </button>
      <button type="button" data-v="area">
        <span class="ik">📍</span><span>Area</span>
      </button>
      <button type="button" data-v="cabang" class="on">
        <span class="ik">🏢</span><span>Cabang</span>
      </button>
    </nav>
